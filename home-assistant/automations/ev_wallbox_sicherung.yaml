id: ev_wallbox_sicherung
alias: EV Wallbox Sicherung (openWB)
description: 'Unabhängige Sicherung, läuft auch wenn ''EV Laden Steuerung (openWB)'' ausgeschaltet ist. Steuerautomation aus - Modus ''PV-Überschuss'': openWB-eigener Modus ''PV Charging'' (lädt nur mit PV-Überschuss), jeder andere ev_lademodus: Stop. Wird die Steuerautomation wieder eingeschaltet, wird ''PV Charging'' beendet (Stop), die Steuerung übernimmt. Steuerautomation an: Stop bei Lademodus ''Aus'' oder im Modus ''Günstig'' bei Preis ab ev_max_strompreis. Beim Ausschalten der Steuerautomation werden außerdem die Fronius-Register (sofern nicht vom Speicher-Netzladen belegt) und die Merker ev_netzladen_aktiv / ev_pv_laden_aktiv zurückgesetzt.'
triggers:
- {trigger: state, entity_id: automation.ev_laden_steuerung_openwb, to: 'off', id: auto_off}
- {trigger: state, entity_id: automation.ev_laden_steuerung_openwb, to: 'on', id: auto_on}
- {trigger: state, entity_id: input_select.ev_lademodus, id: mode}
- {trigger: state, entity_id: select.openwb_chargepoint_1_lademodus, id: openwb}
- {trigger: time_pattern, minutes: /1, id: loop}
conditions: []
actions:
- variables:
    auto_off: '{{ is_state(''automation.ev_laden_steuerung_openwb'', ''off'') }}'
    modus: '{{ states(''input_select.ev_lademodus'') }}'
    price_high: '{{ states(''sensor.electricity_price_wilhelm_busch_strasse_17'') | float(99) >= states(''input_number.ev_max_strompreis'') | float(0) }}'
- variables:
    block: '{{ (auto_off and modus != ''PV-Überschuss'') or (not auto_off and (modus == ''Aus'' or (modus == ''Günstig'' and price_high))) }}'
- alias: 'Sperren: Wallbox auf Stop'
  if:
  - condition: template
    value_template: '{{ block and (not is_state(''select.openwb_chargepoint_1_lademodus'', ''Stop'') or states(''sensor.openwb_chargepoint_1_ladeleistung'') | float(0) > 500) }}'
  then:
  - {action: select.select_option, data: {option: Stop}, target: {entity_id: select.openwb_chargepoint_1_lademodus}}
- alias: 'Steuerung aus + PV-Überschuss: openWB-eigener PV-Modus'
  if:
  - condition: template
    value_template: '{{ auto_off and modus == ''PV-Überschuss'' and not is_state(''select.openwb_chargepoint_1_lademodus'', ''PV Charging'') }}'
  then:
  - {action: select.select_option, data: {option: PV Charging}, target: {entity_id: select.openwb_chargepoint_1_lademodus}}
- alias: 'Steuerung wieder an: PV Charging beenden, Steuerung übernimmt'
  if:
  - {condition: trigger, id: auto_on}
  - {condition: state, entity_id: select.openwb_chargepoint_1_lademodus, state: PV Charging}
  - {condition: state, entity_id: input_boolean.ev_pv_laden_aktiv, state: 'off'}
  then:
  - {action: select.select_option, data: {option: Stop}, target: {entity_id: select.openwb_chargepoint_1_lademodus}}
- alias: 'Steuerautomation aus: Register und Merker zurücksetzen'
  if:
  - condition: template
    value_template: '{{ auto_off }}'
  then:
  - if:
    - {condition: state, entity_id: input_boolean.speicher_netzladen_aktiv, state: 'off'}
    - {condition: state, entity_id: input_boolean.ev_netzladen_aktiv, state: 'on'}
    then:
    - {action: modbus.write_register, data: {address: 40348, hub: gen24, slave: 1, value: 0}}
    - {action: modbus.write_register, data: {address: 40355, hub: gen24, slave: 1, value: 10000}}
  - if:
    - {condition: state, entity_id: input_boolean.ev_netzladen_aktiv, state: 'on'}
    then:
    - {action: input_boolean.turn_off, target: {entity_id: input_boolean.ev_netzladen_aktiv}}
  - if:
    - {condition: state, entity_id: input_boolean.ev_pv_laden_aktiv, state: 'on'}
    then:
    - {action: input_boolean.turn_off, target: {entity_id: input_boolean.ev_pv_laden_aktiv}}
mode: single
max_exceeded: silent

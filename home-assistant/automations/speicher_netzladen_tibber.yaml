alias: Speicher Netzladen (Tibber)
description: >-
  Lädt den Hausspeicher (BYD am Fronius Gen24) per Modbus aus dem Netz, wenn
  input_boolean.tibber_speicher_laden an ist, der Strompreis unter dem Max-Preis
  liegt und der Ladestand unter dem Ziel. Vorrang hat das Auto: läuft Netz- oder
  PV-Laden fürs Auto oder lädt das Auto (>= 500 W), wird nicht geladen.
  Register (Gen24, Integer-Modell): StorCtl_Mod 40348, OutWRte 40355 (negativ =
  Zwangsladen), InWRte 40356. TESTMODUS: Leistung aus
  input_number.speicher_netzlade_leistung (Start 1000 W).
mode: single
triggers:
  - trigger: time_pattern
    seconds: /30
    id: loop
  - trigger: state
    entity_id:
      - input_boolean.tibber_speicher_laden
      - input_boolean.ev_netzladen_aktiv
      - input_boolean.ev_pv_laden_aktiv
    id: change
conditions: []
actions:
  - variables:
      reg: "{{ states('sensor.reading_battery_settings').split(',') }}"
      wcha_w: "{{ reg[0] | float(15360) if reg | length > 0 else 15360 }}"
      rate: >-
        {{ [[(states('input_number.speicher_netzlade_leistung') | float(1000)
        / wcha_w * 10000) | int, 100] | max, 10000] | min }}
      soc: "{{ states('sensor.byd_battery_box_premium_hv_state_of_charge') | float(100) }}"
      ziel: "{{ states('input_number.speicher_ziel_ladestand_netzladen') | float(80) }}"
  - choose:
      - alias: Laden (starten oder weiterführen)
        conditions:
          - condition: state
            entity_id: input_boolean.tibber_speicher_laden
            state: "on"
          - condition: numeric_state
            entity_id: sensor.electricity_price_wilhelm_busch_strasse_17
            below: input_number.speicher_max_strompreis_netzladen
          - condition: state
            entity_id: input_boolean.ev_netzladen_aktiv
            state: "off"
          - condition: state
            entity_id: input_boolean.ev_pv_laden_aktiv
            state: "off"
          - condition: numeric_state
            entity_id: sensor.openwb_chargepoint_1_ladeleistung
            below: 500
          - condition: template
            value_template: >-
              {{ soc < ziel - (0 if is_state('input_boolean.speicher_netzladen_aktiv', 'on') else 5) }}
        sequence:
          - if:
              - condition: state
                entity_id: input_boolean.speicher_netzladen_aktiv
                state: "off"
            then:
              - action: modbus.write_register
                data:
                  address: 40356
                  hub: gen24
                  slave: 1
                  value: "{{ rate }}"
              - action: modbus.write_register
                data:
                  address: 40355
                  hub: gen24
                  slave: 1
                  value: "{{ 65536 - rate }}"
              - action: modbus.write_register
                data:
                  address: 40348
                  hub: gen24
                  slave: 1
                  value: 3
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.speicher_netzladen_aktiv
    default:
      - if:
          - condition: state
            entity_id: input_boolean.speicher_netzladen_aktiv
            state: "on"
        then:
          - if:
              - condition: state
                entity_id: input_boolean.ev_netzladen_aktiv
                state: "off"
            then:
              - action: modbus.write_register
                data:
                  address: 40348
                  hub: gen24
                  slave: 1
                  value: 0
              - action: modbus.write_register
                data:
                  address: 40355
                  hub: gen24
                  slave: 1
                  value: 10000
              - action: modbus.write_register
                data:
                  address: 40356
                  hub: gen24
                  slave: 1
                  value: 10000
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.speicher_netzladen_aktiv

Glas Abend Leicht:
  lovelace-background: "linear-gradient(rgba(8,10,20,0.22), rgba(8,10,20,0.22)), var(--zh-page-bg, linear-gradient(160deg, #0A1020 0%, #1A2850 100%)) center / cover no-repeat fixed"
  primary-color: "#FFC078"
  accent-color: "#FF8A65"
  primary-background-color: "#1B1410"
  secondary-background-color: "#1B1410"
  primary-text-color: "#FFFFFF"
  secondary-text-color: "rgba(255,255,255,0.80)"
  state-icon-color: "#FFC078"
  ha-card-background: "linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.07) 100%)"
  card-background-color: "rgba(255,255,255,0.14)"
  ha-card-border-radius: "28px"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(255,255,255,0.26)"
  ha-card-box-shadow: "0 12px 32px rgba(0,0,0,0.40), inset 0 1px 1px rgba(255,255,255,0.35)"
  ha-card-backdrop-filter: "blur(26px) saturate(160%)"
  ha-tile-icon-border-radius: "50%"
  bubble-main-background-color: "rgba(255,255,255,0.14)"
  bubble-secondary-background-color: "rgba(255,255,255,0.14)"
  bubble-icon-background-color: "rgba(255,255,255,0.20)"
  bubble-button-accent-color: "rgba(255,192,120,0.32)"
  bubble-accent-color: "#FFC078"
  bubble-border-radius: "28px"
  bubble-icon-border-radius: "50%"
  bubble-border: "1px solid rgba(255,255,255,0.26)"
  bubble-box-shadow: "0 12px 32px rgba(0,0,0,0.40), inset 0 1px 1px rgba(255,255,255,0.35)"
  bubble-backdrop-filter: "blur(26px) saturate(160%)"


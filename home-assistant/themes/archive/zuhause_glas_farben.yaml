Glas Graphit:
  modes:
    dark:
      lovelace-background: "radial-gradient(circle at 12% 8%, rgba(45,212,191,0.30), transparent 42%), radial-gradient(circle at 88% 28%, rgba(148,163,184,0.26), transparent 46%), radial-gradient(circle at 35% 92%, rgba(56,189,248,0.20), transparent 46%), linear-gradient(160deg, #0A0D12 0%, #121820 55%, #1B232D 100%)"
      primary-color: "#2DD4BF"
      accent-color: "#FBBF24"
      primary-background-color: "#0A0D12"
      secondary-background-color: "#121820"
      primary-text-color: "#FFFFFF"
      secondary-text-color: "#B7C3D9"
      state-icon-color: "#2DD4BF"
      ha-card-background: "linear-gradient(135deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.07) 100%)"
      card-background-color: "rgba(255,255,255,0.20)"
      ha-card-border-radius: "28px"
      ha-card-border-width: "1.5px"
      ha-card-border-color: "rgba(255,255,255,0.45)"
      ha-card-box-shadow: "0 16px 44px rgba(0,0,0,0.55), inset 0 2px 1px rgba(255,255,255,0.65), inset 0 -2px 1px rgba(255,255,255,0.18), inset 0 0 0 1px rgba(255,255,255,0.14), inset 0 0 28px rgba(255,255,255,0.10)"
      ha-card-backdrop-filter: "blur(26px) saturate(180%)"
      ha-tile-icon-border-radius: "50%"
    light:
      lovelace-background: "radial-gradient(circle at 12% 8%, rgba(45,212,191,0.35), transparent 42%), radial-gradient(circle at 88% 28%, rgba(148,163,184,0.35), transparent 46%), radial-gradient(circle at 35% 92%, rgba(56,189,248,0.25), transparent 46%), linear-gradient(160deg, #EDF1F5 0%, #DDE4EC 55%, #CFD8E3 100%)"
      primary-color: "#0F766E"
      accent-color: "#D97706"
      primary-background-color: "#EDF1F5"
      secondary-background-color: "#DDE4EC"
      primary-text-color: "#14203A"
      secondary-text-color: "#4B5A77"
      state-icon-color: "#0F766E"
      ha-card-background: "linear-gradient(135deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.55) 100%)"
      card-background-color: "rgba(255,255,255,0.85)"
      ha-card-border-radius: "28px"
      ha-card-border-width: "1.5px"
      ha-card-border-color: "rgba(255,255,255,1)"
      ha-card-box-shadow: "0 14px 36px rgba(30,50,90,0.22), inset 0 2px 1px rgba(255,255,255,1), inset 0 -2px 1px rgba(255,255,255,0.7), inset 0 0 0 1px rgba(255,255,255,0.6), inset 0 0 26px rgba(255,255,255,0.45)"
      ha-card-backdrop-filter: "blur(26px) saturate(180%)"
      ha-tile-icon-border-radius: "50%"


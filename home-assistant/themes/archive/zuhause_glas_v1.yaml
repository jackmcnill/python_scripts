Zuhause Glas:
  modes:
    dark:
      lovelace-background: "linear-gradient(160deg, #0B1220 0%, #14213D 55%, #1B2A4A 100%)"
      primary-color: "#4FC3F7"
      accent-color: "#FFB74D"
      primary-background-color: "#0B1220"
      secondary-background-color: "#111A2C"
      primary-text-color: "#F2F5FA"
      secondary-text-color: "#9AA7BD"
      state-icon-color: "#4FC3F7"
      ha-card-background: "rgba(255,255,255,0.07)"
      card-background-color: "rgba(255,255,255,0.07)"
      ha-card-border-radius: "24px"
      ha-card-border-width: "1px"
      ha-card-border-color: "rgba(255,255,255,0.12)"
      ha-card-box-shadow: "0 8px 32px rgba(0,0,0,0.35)"
      ha-card-backdrop-filter: "blur(14px)"
      ha-tile-icon-border-radius: "50%"
    light:
      lovelace-background: "linear-gradient(160deg, #EEF2F8 0%, #DCE6F5 100%)"
      primary-color: "#0277BD"
      accent-color: "#FB8C00"
      primary-background-color: "#EEF2F8"
      secondary-background-color: "#E3E9F2"
      primary-text-color: "#1A2233"
      secondary-text-color: "#5B6880"
      state-icon-color: "#0277BD"
      ha-card-background: "rgba(255,255,255,0.75)"
      card-background-color: "rgba(255,255,255,0.75)"
      ha-card-border-radius: "24px"
      ha-card-border-width: "1px"
      ha-card-border-color: "rgba(255,255,255,0.9)"
      ha-card-box-shadow: "0 8px 24px rgba(30,50,90,0.12)"
      ha-card-backdrop-filter: "blur(14px)"
      ha-tile-icon-border-radius: "50%"
